<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FlashACO Analytics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* ── Tixsheet design tokens (same values as tixsheet.app) ── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg-base:#0c0c1e; --bg-sidebar:#101028; --bg-card:#161630; --bg-card2:#1e1e3a; --bg-hover:#242448; --bg-input:#12122a;
  --border:rgba(255,255,255,0.08); --border2:rgba(255,255,255,0.14); --border3:rgba(255,255,255,0.24);
  --text:#eceaf8; --text2:#9290b8; --text3:#5e5c80;
  --gold:#f5c842; --gold2:#e8a800; --gold-dim:rgba(245,200,66,0.13); --gold-border:rgba(245,200,66,0.26);
  --blue:#7aa3ff; --green:#2ecc71; --green-dim:rgba(46,204,113,0.12); --red:#f16060; --red-dim:rgba(241,96,96,0.12);
  --amber:#f5a623; --amber-dim:rgba(245,166,35,0.12);
  --radius:8px; --radius-lg:12px; --topbar-h:68px;
  --on-gold:#08080f;
}
/* Soft Cream theme */
body.theme-cream{
  --bg-base:#faf8f4;--bg-sidebar:#ffffff;--bg-card:#ffffff;--bg-card2:#f5f2ec;
  --bg-hover:#ede8e0;--bg-input:#f8f5f0;--border:rgba(0,0,0,0.07);
  --border2:rgba(0,0,0,0.12);--border3:rgba(0,0,0,0.20);
  --text:#1a1612;--text2:#8a8278;--text3:#b4afa8;
  --gold:#c2a55a;--gold2:#a88a3a;--gold-dim:rgba(194,165,90,0.1);
  --gold-border:rgba(194,165,90,0.28);--blue:#7c6030;--green:#5a7a3a;
  --green-dim:rgba(90,122,58,0.1);--red:#c0392b;--red-dim:rgba(192,57,43,0.1);
  --amber:#c2a55a;--amber-dim:rgba(194,165,90,0.1);
  --on-gold:#ffffff;
}
/* Arctic theme */
body.theme-arctic{
  --bg-base:#f0f4f8;--bg-sidebar:#ffffff;--bg-card:#ffffff;--bg-card2:#e8f0f8;
  --bg-hover:#dce8f4;--bg-input:#f4f8fc;--border:rgba(0,0,0,0.07);
  --border2:rgba(0,0,0,0.11);--border3:rgba(0,0,0,0.18);
  --text:#0f1f3d;--text2:#5a7a9a;--text3:#8aaac8;
  --gold:#2563eb;--gold2:#1d4ed8;--gold-dim:rgba(37,99,235,0.08);
  --gold-border:rgba(37,99,235,0.25);--blue:#2563eb;--green:#15803d;
  --green-dim:rgba(21,128,61,0.08);--red:#b91c1c;--red-dim:rgba(185,28,28,0.08);
  --amber:#d97706;--amber-dim:rgba(217,119,6,0.08);
  --on-gold:#ffffff;
}

body{font-family:"Inter",sans-serif;background:var(--bg-base);color:var(--text);min-height:100vh;font-size:13px;overflow-x:hidden}
button,input,select{font-family:"Inter",sans-serif}

/* Topbar */
.topbar{height:var(--topbar-h);background:var(--bg-sidebar);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 24px;gap:16px;position:sticky;top:0;z-index:50}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.brand-logo{width:40px;height:40px;border-radius:9px;flex-shrink:0;border:1px solid var(--border2);display:grid;place-items:center;font-size:20px;background:var(--bg-card)}
.brand-name{font-size:21px;font-weight:800;letter-spacing:-0.4px;background:linear-gradient(130deg,var(--text) 20%,var(--gold) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.brand-tag{font-size:10px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--gold);background:var(--gold-dim);border:1px solid var(--gold-border);padding:2px 8px;border-radius:99px}
.topbar-spacer{flex:1}
.topbar-actions{display:flex;gap:8px;align-items:center}
.back-link{color:var(--text2);text-decoration:none;font-size:13px;font-weight:500}
.back-link:hover{color:var(--text)}

.main{max-width:1320px;margin:0 auto;padding:30px 32px 60px}
.page-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:12px}
.page-top h1{font-size:22px;font-weight:700;letter-spacing:-0.6px;line-height:1.2}
.page-top p{font-size:12px;color:var(--text2);margin-top:4px}
.page-top-right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* Mode tabs (tixsheet style) */
.mode-tabs{display:inline-flex;gap:4px;background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:4px;margin-bottom:22px;max-width:100%;overflow-x:auto}
.mode-tab{height:40px;padding:0 20px;border-radius:9px;border:none;background:transparent;color:var(--text2);font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
.mode-tab:hover{color:var(--text)}
.mode-tab.active{background:var(--gold);color:var(--on-gold);font-weight:700}
[hidden]{display:none !important}

/* Inputs & buttons */
select,input[type=search]{height:40px;padding:0 12px;border-radius:var(--radius);border:1px solid var(--border2);background:var(--bg-input);color:var(--text);font-size:13px;outline:none}
select:focus,input[type=search]:focus{border-color:var(--gold-border)}
select option{background:var(--bg-card)}
input::placeholder{color:var(--text3)}
.btn{height:40px;padding:0 16px;border-radius:var(--radius);border:1px solid var(--border2);background:var(--bg-card);color:var(--text2);font-size:14px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:all .12s}
.btn:hover{background:var(--bg-hover);color:var(--text);border-color:var(--border3)}
.btn.primary{background:var(--gold);color:var(--on-gold);border-color:var(--gold);font-weight:700}
.btn.sm{height:32px;padding:0 12px;font-size:12px}

/* Stats (tixsheet) */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px;margin-bottom:24px}
.stat{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px 18px 16px;position:relative;overflow:hidden;transition:border-color .2s,transform .15s}
.stat:hover{border-color:var(--border2);transform:translateY(-1px)}
.stat-icon{position:absolute;right:14px;top:14px;font-size:20px;opacity:.15}
.stat-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.9px;color:var(--text3);margin-bottom:10px}
.stat-val{font-size:21px;font-weight:700;letter-spacing:-.5px}
.stat-sub{font-size:11px;color:var(--text2);margin-top:6px}
.c-gold{color:var(--gold)} .c-green{color:var(--green)} .c-red{color:var(--red)} .c-blue{color:var(--blue)}
.stat.featured{border-color:var(--gold-border);background:linear-gradient(140deg,var(--bg-card) 50%,var(--gold-dim))}

/* Cards */
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg)}
.card-h{display:flex;align-items:center;gap:10px;padding:16px 18px 0;flex-wrap:wrap}
.card-h h2{font-size:14px;font-weight:700}
.card-h .hint{font-size:11px;color:var(--text3);font-weight:600;text-transform:uppercase;letter-spacing:.6px}
.card-b{padding:14px 18px 18px}
.grid-2{display:grid;grid-template-columns:2fr 1fr;gap:16px}
@media (max-width:960px){.grid-2{grid-template-columns:1fr}}

/* Tables (tixsheet) */
.table-wrap{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;overflow-x:auto}
.card .table-wrap{border:none;border-radius:0}
table{width:100%;border-collapse:collapse;font-size:14px}
thead th{background:var(--bg-card2);color:var(--text3);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.6px;padding:11px 14px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--text)}
th .arrow{color:var(--gold);font-size:10px}
tbody tr{border-bottom:1px solid var(--border);transition:background .1s}
tbody tr:last-child{border-bottom:none}
tbody tr:hover{background:var(--bg-hover)}
tbody tr.click{cursor:pointer}
td{padding:11px 14px;vertical-align:middle;white-space:nowrap}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td.num{font-weight:500}
.ev-name{font-weight:600;font-size:14px;line-height:1.3;white-space:normal;min-width:200px}
.ev-seat{font-size:12px;color:var(--text3);margin-top:2px}
.empty{padding:40px 20px;text-align:center;color:var(--text3)}
.empty h3{font-size:14px;font-weight:600;color:var(--text2);margin-bottom:5px}

/* Badges (tixsheet) */
.badge{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;padding:3px 9px;border-radius:99px;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap}
.badge::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor;flex-shrink:0}
.badge.good{background:var(--green-dim);color:var(--green)}
.badge.pending{background:var(--amber-dim);color:var(--amber)}
.badge.expired{background:var(--red-dim);color:var(--red)}
.badge.gold{background:var(--gold-dim);color:var(--gold)}
.badge.plain{background:var(--bg-card2);color:var(--text2)}
.badge.plain::before{display:none}

.who{display:flex;align-items:center;gap:9px;font-weight:500}
.who img,.who .av{width:26px;height:26px;border-radius:50%;flex:none;object-fit:cover;background:var(--bg-card2)}
.who .av{display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--text2)}

/* Chart */
.chart{position:relative}
.chart svg{display:block;width:100%;height:240px;overflow:visible}
.chart .gridline{stroke:var(--border);stroke-width:1}
.chart .baseline{stroke:var(--border3);stroke-width:1}
.chart .tick{fill:var(--text3);font-size:11px;font-variant-numeric:tabular-nums;font-family:"Inter",sans-serif}
.chart .bar{fill:var(--gold);opacity:.85}
.chart .bar.on{opacity:1}
.chart .hit{fill:transparent}
.tip{position:absolute;pointer-events:none;background:var(--bg-card2);border:1px solid var(--border2);border-radius:8px;padding:8px 10px;font-size:12px;white-space:nowrap;transform:translate(-50%,calc(-100% - 10px));opacity:0;transition:opacity .08s;z-index:5;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.tip b{display:block;font-size:13px;color:var(--text)}
.tip span{color:var(--text2)}

/* Detail */
.detail{margin-top:16px}
.detail-h{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.detail-h img,.detail-h .av{width:44px;height:44px;border-radius:50%}
.detail-h .av{display:grid;place-items:center;background:var(--bg-card2);font-weight:700}
.detail-h h2{font-size:18px;font-weight:700;letter-spacing:-.3px}
.detail-h .id{font-size:11px;color:var(--text3)}
.detail-h .btn{margin-left:auto}
.sub-h{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.9px;color:var(--text3);margin:18px 0 10px}

/* Queues */
.queues{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:12px}
.queue ol{list-style:none}
.queue li{display:flex;align-items:center;gap:6px 8px;padding:9px 0;border-bottom:1px solid var(--border);flex-wrap:wrap}
.queue li:last-child{border-bottom:0}
.queue li .n{width:20px;color:var(--text3);font-variant-numeric:tabular-nums;font-weight:600}
.queue li.turn .who{color:var(--gold);font-weight:700}
.queue li .stats-mini{margin-left:auto;white-space:nowrap;font-size:12px;color:var(--text3)}
.queue .meta{font-size:11px;color:var(--text3);margin-top:10px}

/* Login */
.login{max-width:380px;margin:12vh auto;padding:28px}
.login h1{font-size:22px;font-weight:700;margin-bottom:6px}
.login p{color:var(--text2);margin-bottom:22px}
.login label{display:block;font-size:12px;font-weight:600;color:var(--text2);margin-bottom:6px}
.login input{width:100%;height:44px;padding:0 14px;border-radius:var(--radius);border:1px solid var(--border2);background:var(--bg-input);color:var(--text);font-size:14px;outline:none;margin-bottom:14px}
.login input:focus{border-color:var(--gold-border)}
.login .err{color:var(--red);font-size:13px;min-height:18px;margin-bottom:6px}
.banner{padding:12px 16px;border-radius:var(--radius-lg);margin-bottom:18px;font-size:13px;background:var(--gold-dim);border:1px solid var(--gold-border);color:var(--text)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

@media (max-width:700px){
  .topbar{padding:0 16px}
  .brand-tag,.back-link{display:none}
  .main{padding:20px 16px 48px}
  .mode-tab{padding:0 14px;font-size:13px}
}
</style>
</head>
<body>
<div class="topbar">
  <a class="brand" href="/"><div class="brand-logo" aria-hidden="true">⚡</div><span class="brand-name">FlashACO</span></a>
  <span class="brand-tag">Analytics</span>
  <div class="topbar-spacer"></div>
  <div class="topbar-actions">
    <a class="back-link" href="/">← Tixsheet</a>
    <button class="btn sm" id="logout" type="button" hidden>Déconnexion</button>
  </div>
</div>
<div class="main" id="app"></div>

<script>
/* ═════════════ CONFIG ═════════════
   The anon key is public (same as in tixsheet). NEVER put the service_role / secret key here. */
const SUPABASE_URL = "https://ahysgnekipugsuwbwzee.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFoeXNnbmVraXB1Z3N1d2J3emVlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEzNjE5MjgsImV4cCI6MjA5NjkzNzkyOH0.dKnJDqbGQCNY64G5Mxu7vljMFmAK11uVo31eA9C1jrI";
/* ══════════════════════════════════ */

// Same theme as tixsheet (dark / cream / arctic, saved by tixsheet in localStorage)
(function applyTixTheme() {
  let t = "dark";
  try { t = localStorage.getItem("tix_theme") || "dark"; } catch {}
  if (t !== "dark") document.body.classList.add("theme-" + t);
})();

const DEMO = new URLSearchParams(location.search).has("demo");
const app = document.getElementById("app");
const eur = n => (Number(n) || 0).toLocaleString("fr-FR", { style: "currency", currency: "EUR", maximumFractionDigits: 2 });
const int = n => (Number(n) || 0).toLocaleString("fr-FR");
const pct = n => (n == null ? "—" : `${Math.round(n)} %`);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmtDate = d => d ? new Date(d).toLocaleString("fr-FR", { day: "2-digit", month: "2-digit", year: "2-digit", hour: "2-digit", minute: "2-digit" }) : "—";
const DAY = 86400000;

let sb = null;
let DATA = { claims: [], events: [], queues: [], users: [] };
const state = { tab: "overview", guild: "all", period: "30", memberSort: { key: "good", dir: -1 }, memberSearch: "",
  selected: null, hist: { user: "all", status: "all", q: "" } };

/* ───────── Data ───────── */
async function fetchAll(table, order) {
  const rows = [];
  for (let from = 0; ; from += 1000) {
    let q = sb.from(table).select("*").range(from, from + 999);
    if (order) q = q.order(order, { ascending: true });
    const { data, error } = await q;
    if (error) throw error;
    rows.push(...data);
    if (data.length < 1000) break;
  }
  return rows;
}

async function loadData() {
  if (DEMO) { DATA = demoData(); return; }
  const [claims, events, queues, users] = await Promise.all([
    fetchAll("aco_claims", "claimed_at"), fetchAll("aco_queue_events", "at"), fetchAll("aco_queues"), fetchAll("aco_users"),
  ]);
  DATA = { claims, events, queues, users };
}

function userMap() {
  const m = new Map();
  for (const u of DATA.users) m.set(u.id, u);
  for (const c of DATA.claims) if (!m.has(c.user_id) && c.username) m.set(c.user_id, { id: c.user_id, username: c.username });
  return m;
}
const nameOf = (id, um) => um.get(id)?.username || `…${String(id).slice(-4)}`;
function avatar(id, um) {
  const u = um.get(id);
  return u?.avatar ? `<img src="${esc(u.avatar)}" alt="" loading="lazy">`
    : `<span class="av">${esc((u?.username || "?").slice(0, 1).toUpperCase())}</span>`;
}

function periodStart() { return state.period === "all" ? 0 : Date.now() - Number(state.period) * DAY; }
function filtered() {
  const since = periodStart(), g = state.guild;
  const inGuild = r => g === "all" || r.guild_id === g;
  return {
    claims: DATA.claims.filter(c => inGuild(c) && new Date(c.claimed_at).getTime() >= since),
    events: DATA.events.filter(e => inGuild(e) && new Date(e.at).getTime() >= since),
    queues: DATA.queues.filter(q => inGuild(q)),
  };
}

/* Per-member stats (no commission) */
function memberStats(f) {
  const m = new Map();
  const get = id => {
    if (!m.has(id)) m.set(id, { id, claims: 0, good: 0, expired: 0, pending: 0, seats: 0, retail: 0, skips: 0, afk: 0, lastClaim: null });
    return m.get(id);
  };
  for (const c of f.claims) {
    const s = get(c.user_id);
    s.claims++;
    s[c.status === "good" ? "good" : c.status === "expired" ? "expired" : "pending"]++;
    if (c.status === "good") { s.seats += Number(c.quantity) || 0; s.retail += Number(c.price) || 0; }
    if (!s.lastClaim || c.claimed_at > s.lastClaim) s.lastClaim = c.claimed_at;
  }
  for (const e of f.events) {
    if (e.type === "skip") get(e.user_id).skips++;
    if (e.type === "afk") get(e.user_id).afk++;
  }
  for (const q of f.queues) for (const id of q.members || []) get(id);
  for (const s of m.values()) s.rate = s.good + s.expired > 0 ? (s.good / (s.good + s.expired)) * 100 : null;
  return [...m.values()];
}

/* ───────── Render ───────── */
const TABS = [["overview", "Vue d'ensemble"], ["members", "Membres"], ["history", "Historique"], ["queues", "Files d'attente"]];

function render() {
  const um = userMap();
  const f = filtered();
  const members = memberStats(f);
  const guilds = [...new Map([...DATA.claims, ...DATA.queues].filter(r => r.guild_id).map(r => [r.guild_id, r.guild_name || r.guild_id])).entries()];

  app.innerHTML = `
    ${DEMO ? `<div class="banner">Mode démo — données fictives. Retire <b>?demo</b> de l'adresse pour voir tes vraies données.</div>` : ""}
    <div class="page-top">
      <div><h1>Analytics ACO</h1><p>Paniers réclamés, résultats et files d'attente de ton équipe · mis à jour à ${new Date().toLocaleTimeString("fr-FR")}</p></div>
      <div class="page-top-right">
        <label class="sr" for="f-guild">Serveur</label>
        <select id="f-guild"><option value="all">Tous les serveurs</option>
          ${guilds.map(([id, n]) => `<option value="${esc(id)}" ${state.guild === id ? "selected" : ""}>${esc(n)}</option>`).join("")}</select>
        <label class="sr" for="f-period">Période</label>
        <select id="f-period">${[["7", "7 derniers jours"], ["30", "30 derniers jours"], ["90", "90 derniers jours"], ["all", "Tout l'historique"]]
          .map(([v, l]) => `<option value="${v}" ${state.period === v ? "selected" : ""}>${l}</option>`).join("")}</select>
        <button class="btn primary" id="refresh" type="button">↻ Actualiser</button>
      </div>
    </div>
    <div class="mode-tabs" role="tablist">
      ${TABS.map(([k, l]) => `<button class="mode-tab ${state.tab === k ? "active" : ""}" role="tab" data-tab="${k}" aria-selected="${state.tab === k}">${l}</button>`).join("")}
    </div>
    <section class="panel" ${state.tab !== "overview" ? "hidden" : ""}>${overview(f, members, um)}</section>
    <section class="panel" ${state.tab !== "members" ? "hidden" : ""}>${membersPanel(f, members, um)}</section>
    <section class="panel" ${state.tab !== "history" ? "hidden" : ""}>${historyPanel(f, members, um)}</section>
    <section class="panel" ${state.tab !== "queues" ? "hidden" : ""}>${queuesPanel(f, members, um)}</section>`;
  bind(f, um);
  if (state.tab === "overview") drawChart(f.claims);
}

function stats(list) {
  return `<div class="stats">${list.map(k => `
    <div class="stat ${k.featured ? "featured" : ""}"><span class="stat-icon" aria-hidden="true">${k.icon || ""}</span>
      <div class="stat-label">${k.label}</div><div class="stat-val ${k.cls || ""}">${k.value}</div>
      ${k.sub ? `<div class="stat-sub">${k.sub}</div>` : ""}</div>`).join("")}</div>`;
}

function totals(f) {
  const good = f.claims.filter(c => c.status === "good");
  const expired = f.claims.filter(c => c.status === "expired").length;
  return {
    good: good.length, expired, pending: f.claims.length - good.length - expired,
    seats: good.reduce((a, c) => a + (Number(c.quantity) || 0), 0),
    retail: good.reduce((a, c) => a + (Number(c.price) || 0), 0),
    rate: good.length + expired ? (good.length / (good.length + expired)) * 100 : null,
  };
}

/* ───────── Chart: claims per day (per week for long ranges) ───────── */
function drawChart(claims) {
  const el = document.getElementById("chart");
  if (!el) return;
  const now = Date.now();
  const first = claims.length ? Math.min(...claims.map(c => new Date(c.claimed_at).getTime())) : now - 30 * DAY;
  const start = state.period === "all" ? first : now - Number(state.period) * DAY;
  const spanDays = Math.max(1, Math.ceil((now - start) / DAY));
  const step = spanDays > 120 ? 7 : 1;
  document.getElementById("chart-hint").textContent = step === 7 ? "par semaine" : "par jour";
  const dayStart = t => { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); };
  const s0 = dayStart(start);
  const n = Math.ceil((dayStart(now) - s0) / DAY / step) + 1;
  const buckets = Array.from({ length: n }, (_, i) => ({ t: s0 + i * step * DAY, v: 0 }));
  for (const c of claims) {
    const i = Math.floor((dayStart(new Date(c.claimed_at).getTime()) - s0) / DAY / step);
    if (buckets[i]) buckets[i].v++;
  }
  const W = el.clientWidth || 700, H = 240, L = 32, R = 8, T = 10, B = 26;
  const max = Math.max(1, ...buckets.map(b => b.v));
  const niceMax = max <= 4 ? max : Math.ceil(max / 5) * 5;
  const ticks = niceMax <= 4 ? Array.from({ length: niceMax + 1 }, (_, i) => i) : [0, 1, 2, 3, 4, 5].map(k => Math.round(niceMax / 5 * k));
  const pw = W - L - R, ph = H - T - B;
  const bw = pw / n, gap = Math.min(2 + bw * 0.2, 8), barW = Math.max(2, bw - gap);
  const y = v => T + ph - (v / niceMax) * ph;
  const lblEvery = Math.ceil(n / Math.max(2, Math.floor(pw / 64)));
  const fmtT = t => new Date(t).toLocaleDateString("fr-FR", { day: "2-digit", month: "2-digit" });
  const r = Math.min(4, barW / 2);
  const barPath = (x, v) => {
    if (!v) return "";
    const yt = y(v), yb = T + ph, h = yb - yt, rr = Math.min(r, h);
    return `M${x},${yb} V${yt + rr} Q${x},${yt} ${x + rr},${yt} H${x + barW - rr} Q${x + barW},${yt} ${x + barW},${yt + rr} V${yb} Z`;
  };
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Paniers réclamés ${step === 7 ? "par semaine" : "par jour"}">
    ${ticks.map(v => `<line class="gridline" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text class="tick" x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${v}</text>`).join("")}
    ${buckets.map((b, i) => `<rect class="hit" data-i="${i}" x="${L + i * bw}" y="${T}" width="${bw}" height="${ph}"/><path class="bar" d="${barPath(L + i * bw + gap / 2, b.v)}"/>`).join("")}
    <line class="baseline" x1="${L}" x2="${W - R}" y1="${T + ph}" y2="${T + ph}"/>
    ${buckets.map((b, i) => i % lblEvery === 0 ? `<text class="tick" x="${L + i * bw + bw / 2}" y="${H - 6}" text-anchor="middle">${fmtT(b.t)}</text>` : "").join("")}
  </svg><div class="tip" id="tip"></div>`;
  const tip = el.querySelector("#tip");
  el.querySelectorAll(".hit").forEach(h => {
    h.addEventListener("mouseenter", () => {
      const b = buckets[+h.dataset.i];
      const label = step === 7 ? `Semaine du ${fmtT(b.t)}` : new Date(b.t).toLocaleDateString("fr-FR", { weekday: "short", day: "2-digit", month: "short" });
      tip.innerHTML = `<b>${b.v} panier${b.v > 1 ? "s" : ""}</b><span>${label}</span>`;
      const box = el.getBoundingClientRect(), hb = h.getBoundingClientRect();
      tip.style.left = `${hb.left - box.left + hb.width / 2}px`;
      tip.style.top = `${(y(b.v) / H) * box.height}px`;
      tip.style.opacity = 1;
      h.nextElementSibling?.classList.add("on");
    });
    h.addEventListener("mouseleave", () => { tip.style.opacity = 0; h.nextElementSibling?.classList.remove("on"); });
  });
}

/* ───────── Events ───────── */
function bind(f, um) {
  const on = (id, ev, fn) => document.getElementById(id)?.addEventListener(ev, fn);
  document.querySelectorAll(".mode-tab").forEach(b => b.addEventListener("click", () => { state.tab = b.dataset.tab; render(); }));
  on("f-guild", "change", e => { state.guild = e.target.value; render(); });
  on("f-period", "change", e => { state.period = e.target.value; render(); });
  on("refresh", "click", () => refresh());
  document.querySelectorAll("tr.click").forEach(tr => tr.addEventListener("click", () => {
    state.selected = tr.dataset.user; state.tab = "members"; render();
    document.getElementById("detail")?.scrollIntoView({ behavior: "smooth", block: "start" });
  }));
  on("close-detail", "click", () => { state.selected = null; render(); });
  document.querySelectorAll("th[data-sort]").forEach(th => th.addEventListener("click", () => {
    const k = th.dataset.sort;
    state.memberSort = { key: k, dir: state.memberSort.key === k ? -state.memberSort.dir : (k === "name" ? 1 : -1) };
    render();
  }));
  const keepFocus = (id, fn) => on(id, "input", e => { fn(e.target.value); const pos = e.target.selectionStart; render();
    const el = document.getElementById(id); el.focus(); el.setSelectionRange(pos, pos); });
  keepFocus("m-search", v => state.memberSearch = v);
  keepFocus("h-q", v => state.hist.q = v);
  on("h-user", "change", e => { state.hist.user = e.target.value; render(); });
  on("h-status", "change", e => { state.hist.status = e.target.value; render(); });
  on("csv", "click", () => exportCsv(historyRows(f), um));
}

function exportCsv(rows, um) {
  const head = ["date", "membre", "user_id", "evenement", "categorie", "quantite", "sieges", "prix", "statut", "serveur", "salon", "site", "date_evenement"];
  const q = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const lines = [head.join(";"), ...rows.map(c => [fmtDate(c.claimed_at), nameOf(c.user_id, um), c.user_id, c.event, c.category, c.quantity,
    c.seats, String(c.price ?? "").replace(".", ","), c.status, c.guild_name, c.channel_name, c.site, c.event_date].map(q).join(";"))];
  const blob = new Blob(["﻿" + lines.join("\n")], { type: "text/csv;charset=utf-8" });
  const a = Object.assign(document.createElement("a"), { href: URL.createObjectURL(blob), download: `flashaco-paniers-${new Date().toISOString().slice(0, 10)}.csv` });
  a.click(); URL.revokeObjectURL(a.href);
}

/* ───────── Demo data ───────── */
function demoData() {
  const names = [["111", "kzy"], ["222", "Erraih"], ["333", "Monstrdézane"], ["444", "Kappa"], ["555", "Coromboogi"]];
  const events = [["CELINE DION", "CATEGORIE 1", 200.25], ["A$AP Rocky - Don't Be Dumb World Tour", "CATEGORIE 2 VISIBILITE REDUITE", 68.5], ["Aya Nakamura", "FOSSE", 79], ["PNL", "CATEGORIE 1", 95]];
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const claims = [], ev = [];
  for (let i = 0; i < 140; i++) {
    const [uid, uname] = names[Math.floor(rnd() * names.length)];
    const [e, cat, p] = events[Math.floor(rnd() * events.length)];
    const qty = 1 + Math.floor(rnd() * 4);
    const t = Date.now() - Math.floor(rnd() * 80 * DAY);
    const st = Date.now() - t < 2 * DAY && rnd() < .6 ? "pending" : rnd() < .78 ? "good" : "expired";
    claims.push({ id: "c" + i, claimed_at: new Date(t).toISOString(), user_id: uid, username: uname, guild_id: i % 3 ? "g1" : "g2",
      guild_name: i % 3 ? "FlashTICKET" : "A MOULA NOUBA", channel_name: i % 3 ? "claim-test" : "celine-module-nouba", event: e, category: cat,
      quantity: qty, seats: Array.from({ length: qty }, (_, k) => 30 + k).join(" / "), price: +(p * qty).toFixed(2), status: st,
      warning: rnd() < .12 ? "Seats are not contiguous" : null });
  }
  for (let i = 0; i < 60; i++) ev.push({ id: "e" + i, at: new Date(Date.now() - rnd() * 60 * DAY).toISOString(), user_id: names[Math.floor(rnd() * names.length)][0], guild_id: "g1", type: rnd() < .5 ? "skip" : "afk" });
  return {
    claims, events: ev, users: names.map(([id, username]) => ({ id, username })),
    queues: [
      { id: "q1", guild_id: "g1", guild_name: "FlashTICKET", channel_name: "claim-test", active: true, members: ["111", "222", "333", "444"], holder: "222", runner: "111", priority: ["444"], updated_at: new Date().toISOString() },
      { id: "q2", guild_id: "g2", guild_name: "A MOULA NOUBA", channel_name: "celine-module-nouba", active: true, members: ["333", "555", "111"], holder: "333", runner: "333", priority: [], updated_at: new Date().toISOString() },
    ],
  };
}

  if (DEMO) return refresh();
  if (!window.supabase || SUPABASE_ANON_KEY.startsWith("PASTE")) {
    app.innerHTML = `<div class="card"><div class="empty"><h3>Configuration manquante</h3>Colle la clé anon Supabase en haut du fichier. Aperçu : <a href="?demo">?demo</a></div></div>`;
    return;
  }
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const { data: { session } } = await sb.auth.getSession().catch(() => ({ data: {} }));
  if (session) return refresh();

  // Reuse the tixsheet login (tixsheet stores { access_token, user } under the same key)
  try {
    const ref = new URL(SUPABASE_URL).hostname.split(".")[0];
    const saved = JSON.parse(localStorage.getItem(`sb-${ref}-auth-token`) || "null");
    const token = saved?.access_token;
    const exp = token ? JSON.parse(atob(token.split(".")[1].replace(/-/g, "+").replace(/_/g, "/"))).exp : 0;
    if (token && exp * 1000 > Date.now()) {
      sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
        global: { headers: { Authorization: `Bearer ${token}` } },
        auth: { persistSession: false, autoRefreshToken: false, storageKey: "aco-dashboard-unused" },
      });
      sb.auth.getUser = async () => ({ data: { user: saved.user || null } });
      sb.auth.signOut = async () => { localStorage.removeItem(`sb-${ref}-auth-token`); };
      return refresh();
    }
  } catch { /* fall through to the login form */ }
  showLogin();
})();
</script>
</body>
</html>
